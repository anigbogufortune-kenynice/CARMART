name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CAR_CHECK_PROVIDER: fake
  AI_CHECK_PROVIDER: fake
  EMAIL_PROVIDER: log
  FAKE_PROVIDER_STRICT: '1'
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run type-check

      - name: Unit tests
        run: npm run test

      - name: Start Supabase
        run: npx supabase start

      - name: Reset database
        run: npx supabase db reset

      - name: Write .env.test and .env.local from the local stack
        run: |
          npx supabase status -o env > .env.test
          set -a; . ./.env.test; set +a
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "NEXT_PUBLIC_SITE_URL=http://localhost:3000"
            echo "NEXT_PUBLIC_SUPPORT_EMAIL=support@carmart.example"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "INTERNAL_JOB_SECRET=ci-internal-job-secret-0123456789abcdef"
          } > .env.local

      - name: Integration tests
        run: npm run test:integration

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

      - name: Build
        run: npm run build
